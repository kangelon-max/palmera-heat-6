<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palmera Heat IV — an original Palmera Bay crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; touch-action: none; overscroll-behavior: none; }
  #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #game { touch-action: none; }
  #hud { pointer-events: none; }
  /* Touch overlay (created by src/touch.js, touch devices only). */
  #tui { position: fixed; inset: 0; z-index: 10; pointer-events: none; touch-action: none;
         font-family: sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #tlook { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
  #tjoy { position: absolute; width: 128px; height: 128px; border-radius: 50%; display: none;
          border: 2px solid rgba(255,255,255,0.35); background: rgba(12,15,21,0.28); pointer-events: none; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
           border-radius: 50%; background: rgba(232,62,140,0.45); border: 2px solid rgba(255,255,255,0.55); }
  .tbtn { position: absolute; display: none; pointer-events: auto; touch-action: none;
          border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
          background: rgba(12,15,21,0.55); color: #f2f0ea;
          font: bold 13px sans-serif; letter-spacing: 0.04em; padding: 0; }
  .tbtn:active { background: rgba(142,36,85,0.75); }
  .tbtn.on { background: rgba(142,36,85,0.85); border-color: #e83e8c; }
  #t-fire { right: 18px; bottom: 138px; width: 92px; height: 92px; font-size: 17px;
            background: rgba(142,36,85,0.55); border-color: rgba(232,62,140,0.8); }
  #t-aim { right: 124px; bottom: 128px; width: 62px; height: 62px; }
  #t-e { right: 26px; bottom: 252px; width: 60px; height: 60px; }
  #t-f { right: 100px; bottom: 218px; width: 60px; height: 60px; }
  #t-g { right: 168px; bottom: 178px; width: 54px; height: 54px; font-size: 10px; }
  #t-jump { right: 196px; bottom: 96px; width: 58px; height: 58px; font-size: 11px; }
  #t-run { right: 130px; bottom: 44px; width: 52px; height: 52px; }
  #t-radio { right: 196px; bottom: 170px; width: 54px; height: 54px; font-size: 10px; }
  #t-wheel { right: 14px; top: 118px; width: 58px; height: 58px; font-size: 10px; border-radius: 16px; }
  #t-pause { right: 82px; top: 118px; width: 44px; height: 44px; font-size: 12px; border-radius: 14px; }
  #t-rotate { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: none;
              background: rgba(12,15,21,0.82); color: #ffd489; border: 1px solid rgba(242,182,60,0.6);
              border-radius: 12px; padding: 9px 14px; font: bold 13.5px sans-serif; white-space: nowrap; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palmera Heat IV: a true-3D open-world crime game set in the invented coastal city of Palmera Bay — drive, swim, take jobs from Marla Voss, dodge the PBPD, and beware the shoe shop that is not a shoe shop"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
